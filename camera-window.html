<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cámara</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="camera-body">
  <div class="titlebar camera-titlebar">
    <span class="title" id="camTitle">📹 Cámara</span>
    <div class="titlebar-buttons">
      <button class="tb-btn" data-action="minimize">−</button>
      <button class="tb-btn" data-action="maximize">□</button>
      <button class="tb-btn close" data-action="close">×</button>
    </div>
  </div>

  <div class="cam-container" id="camContainer">
    <video id="video" autoplay playsinline muted></video>

    <div class="controls" id="controls">
      <button class="ctrl-btn" id="btnFlash" title="Flash">💡</button>
      <button class="ctrl-btn" id="btnSettings" title="Ajustes" data-i18n="settings">⚙</button>
      <button class="ctrl-btn" id="btnCenter" title="Centrar" data-i18n="center">⊹</button>
    </div>

    <div class="panel" id="panel">
      <div class="section-title" data-i18n="zoom">Zoom</div>
      <label><span data-i18n="zoom">Zoom</span>: <span id="zoomVal">1.0</span>x</label>
      <input type="range" id="zoom" min="1" max="4" step="0.1" value="1">

      <div class="section-title" data-i18n="crop">Recorte</div>
      <label><span data-i18n="crop">Recorte</span>: <span id="cropVal">0</span>px</label>
      <input type="range" id="crop" min="0" max="100" step="1" value="0">

      <div class="pad">
        <div></div>
        <button data-dir="up">▲</button>
        <div></div>
        <button data-dir="left">◀</button>
        <button data-dir="reset">•</button>
        <button data-dir="right">▶</button>
        <div></div>
        <button data-dir="down">▼</button>
        <div></div>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="camera-renderer.js"></script>
</body>
</html>
